<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>去做 · 后端测试台</title>
<link rel="stylesheet" href="style.css?v=20261121">
</head>
<body>
<header class="topbar">
  <div class="brand">去做<span class="ver">测试台</span></div>
  <div class="who" id="who">加载中…</div>
  <div class="top-actions">
    <button class="ghost" id="btn-login">登录 / 注册</button>
    <button class="ghost hidden" id="btn-logout">登出</button>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="materials">① 材料库</button>
  <button class="tab" data-tab="chat">② 生成方案</button>
  <button class="tab" data-tab="plans">③ 我的方案</button>
  <span class="spacer"></span>
  <span class="hint" id="model-hint"></span>
</nav>

<main>
  <section class="panel" id="tab-materials">
    <div class="two-col">
      <div class="col-form">
        <h2 id="mat-form-title">新增材料</h2>
        <form id="mat-form" class="stack">
          <label>标题<input name="title" required maxlength="120" placeholder="如：高数课件 第3章 极限"></label>
          <label>主题<input name="topic" required maxlength="40" placeholder="如：高数"></label>
          <div class="uploadbox">
            <div class="box-title">从文件读取正文（可选）</div>
            <input type="file" id="mat-file" accept=".txt,.md,.markdown,.csv,.pdf,.docx,.pptx">
            <div class="hint" id="mat-file-hint">支持 txt / md / pdf / docx / pptx，≤20MB。选中后先转成 Markdown 再填进摘录，可再改；不解析版式、不做 OCR。</div>
            <button type="button" class="ghost" id="mat-dl" style="display:none">下载 .md</button>
          </div>
          <label>摘录原文<textarea name="excerpt" required rows="5" placeholder="把课件原文/网页正文粘贴进来"></textarea></label>
          <label>来源类型
            <select name="source_kind">
              <option value="courseware">课件</option>
              <option value="manual">手工整理</option>
              <option value="link">网页链接</option>
            </select>
          </label>
          <div class="row">
            <label>文件名<input name="source_file" placeholder="高数课件.pdf"></label>
            <label>起始页<input name="source_page_start" type="number" min="1"></label>
            <label>结束页<input name="source_page_end" type="number" min="1"></label>
          </div>
          <label>网页链接<input name="source_url" placeholder="https://…（有则可跳转）"></label>
          <label>备注（不参与公开版）<input name="note" maxlength="500"></label>
          <div class="row">
            <button type="submit" class="primary" id="mat-submit">保存材料</button>
            <button type="button" class="ghost" id="mat-reset">清空</button>
          </div>
        </form>
      </div>
      <div class="col-list">
        <div class="toolbar">
          <input id="mat-q" placeholder="搜标题 / 摘录 / 备注" class="grow">
          <select id="mat-topic"><option value="">全部主题</option></select>
          <button class="ghost" id="mat-refresh">刷新</button>
        </div>
        <div class="bulkbar">
          <span id="mat-sel-info">已选 0 条</span>
          <button class="primary small" id="mat-send">送到生成 →</button>
        </div>
        <div id="mat-list" class="list"></div>
      </div>
    </div>
  </section>

  <section class="panel hidden" id="tab-chat">
    <div class="two-col wide-left">
      <div class="col-form">
        <h2>对话设置</h2>
        <div class="stack">
          <label>任务类型
            <select id="task-type">
              <option value="review">复习笔记</option>
              <option value="travel">周末行程</option>
              <option value="activity">活动流程</option>
            </select>
          </label>
          <label>我要什么<textarea id="goal" rows="2" placeholder="如：帮我安排 15 分钟高数复习"></textarea></label>
          <label>条件（JSON，可直接改）
            <textarea id="conditions" rows="7" spellcheck="false"></textarea>
          </label>
          <div class="row">
            <button class="primary" id="btn-start">新建对话 / 检索材料</button>
            <button class="ghost" id="btn-reset-conv">清空对话</button>
          </div>
          <div id="conv-box" class="box hidden">
            <div class="box-title">候选材料（勾选后确认）</div>
            <div id="candidates" class="list compact"></div>
            <button class="primary small" id="btn-confirm">确认使用这些材料</button>
          </div>
          <div class="box">
            <div class="box-title">模型（可多选对比）</div>
            <div id="models" class="models"></div>
            <div class="row">
              <button class="primary" id="btn-generate">生成方案</button>
              <span class="hint" id="gen-hint"></span>
            </div>
          </div>
          <div class="box">
            <div class="box-title">继续说一句（自然语言改条件）</div>
            <textarea id="turn-text" rows="2" placeholder="例：时间只剩 5 分钟了，例题一定要讲"></textarea>
            <div class="row">
              <button class="primary small" id="btn-turn">发送并重排</button>
              <span class="hint" id="turn-hint">会保留已确认的重点</span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-list">
        <div class="toolbar">
          <span class="hint" id="conv-state">还没有对话</span>
          <span class="spacer"></span>
          <button class="ghost" id="btn-clear-results">清空结果</button>
        </div>
        <div id="results"></div>
      </div>
    </div>
  </section>

  <section class="panel hidden" id="tab-plans">
    <div class="toolbar">
      <input id="plan-q" class="grow" placeholder="在本页方案里过滤标题（本地过滤）">
      <button class="ghost" id="plan-refresh">刷新</button>
    </div>
    <div id="plan-list" class="list"></div>
  </section>
</main>

<div class="modal hidden" id="modal">
  <div class="modal-box">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="ghost small" id="modal-close">关闭</button></div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
